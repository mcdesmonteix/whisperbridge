<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhisperBridge — Proposal 1: Aurora Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080c14;
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-glow: rgba(56,189,248,0.25);
      --text: #f0f6ff;
      --text-muted: rgba(180,210,255,0.55);
      --text-dim: rgba(180,210,255,0.3);
      --teal: #2dd4bf;
      --purple: #a78bfa;
      --gradient: linear-gradient(135deg, #2dd4bf, #818cf8, #c084fc);
      --gradient-btn: linear-gradient(135deg, #0ea5e9, #6366f1, #a855f7);
      --me-bubble: linear-gradient(135deg, #0d9488, #4f46e5);
      --other-bubble: rgba(255,255,255,0.06);
      --online: #34d399;
      --scrollbar: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── AURORA BACKGROUND ── */
    .aurora-bg {
      position: fixed; inset: 0; z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .aurora-bg::before {
      content: '';
      position: absolute;
      top: -40%; left: -20%;
      width: 80%; height: 80%;
      background: radial-gradient(ellipse, rgba(56,189,248,0.18) 0%, transparent 70%);
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .aurora-bg::after {
      content: '';
      position: absolute;
      top: -20%; right: -20%;
      width: 70%; height: 70%;
      background: radial-gradient(ellipse, rgba(168,85,247,0.15) 0%, transparent 70%);
      animation: drift2 15s ease-in-out infinite alternate;
    }
    .aurora-spot {
      position: absolute;
      bottom: 10%; left: 10%;
      width: 50%; height: 40%;
      background: radial-gradient(ellipse, rgba(45,212,191,0.1) 0%, transparent 70%);
      animation: drift1 18s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.1); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,60px) scale(0.9); } }

    .hidden { display: none !important; }

    /* ══════════════════════════════
       LOGIN SCREEN
    ══════════════════════════════ */
    #screen-select {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      height: 100dvh;
    }

    .select-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 48px 40px 40px;
      width: 360px;
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      box-shadow: 0 0 0 1px rgba(56,189,248,0.06), 0 32px 64px rgba(0,0,0,0.5);
      text-align: center;
    }

    .logo-wrap {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0d9488, #4f46e5);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 32px rgba(56,189,248,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }

    .app-title {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e0f2fe, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .app-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 400;
    }

    .label {
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: left;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-group { margin-bottom: 16px; text-align: left; }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      font-size: 0.92rem;
      color: var(--text);
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input::placeholder { color: var(--text-dim); }
    .form-group input:focus,
    .form-group select:focus {
      border-color: rgba(56,189,248,0.5);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.08);
    }
    .form-group select option { background: #111827; color: #f0f6ff; }

    .btn-join {
      width: 100%;
      padding: 14px;
      background: var(--gradient-btn);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn-join::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      pointer-events: none;
    }
    .btn-join:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(99,102,241,0.45); }
    .btn-join:active { transform: translateY(0); }

    .divider { margin: 24px 0 16px; display: flex; align-items: center; gap: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span { font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; }

    .theme-label { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 10px; text-align: center; }
    .badge {
      display: inline-block;
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.2);
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #7dd3fc;
      margin-top: 20px;
    }

    /* ══════════════════════════════
       CHAT SCREEN
    ══════════════════════════════ */
    #screen-chat {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100dvh;
    }

    /* Header */
    header {
      background: rgba(8,12,20,0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: var(--gradient-btn);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 14px rgba(99,102,241,0.4);
    }
    .header-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .header-room {
      font-size: 0.72rem; color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
    }

    .header-right { display: flex; align-items: center; gap: 8px; }
    .user-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
    }
    .user-pill.me {
      background: rgba(99,102,241,0.12);
      border-color: rgba(99,102,241,0.3);
      color: #a5b4fc;
    }
    .user-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 6px var(--online);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .btn-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.08); color: var(--text); }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 20px 20px 10px;
      display: flex; flex-direction: column; gap: 12px;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    .msg-system {
      text-align: center; font-size: 0.71rem;
      color: var(--text-dim); padding: 2px 0;
    }

    .msg-system .sys-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.68rem;
    }

    .message {
      max-width: 72%;
      display: flex; flex-direction: column; gap: 4px;
    }
    .message.me { align-self: flex-end; align-items: flex-end; }
    .message.other { align-self: flex-start; align-items: flex-start; }

    .message-sender {
      font-size: 0.68rem;
      color: var(--text-muted);
      padding: 0 6px;
      font-weight: 500;
    }

    .message-bubble {
      padding: 11px 16px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .message.me .message-bubble {
      background: var(--me-bubble);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 16px rgba(79,70,229,0.25);
    }
    .message.other .message-bubble {
      background: var(--other-bubble);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .message-translation {
      font-size: 0.73rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 0 6px;
    }
    .message-meta {
      font-size: 0.65rem;
      color: var(--text-dim);
      padding: 0 6px;
    }

    /* Share prompt */
    .msg-share-prompt {
      background: rgba(99,102,241,0.06);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 16px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 8px;
      align-self: center; max-width: 90%; text-align: center;
    }
    .msg-share-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .msg-share-subtitle { font-size: 0.77rem; color: var(--text-muted); }
    .msg-share-url {
      font-size: 0.72rem; font-family: monospace;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px;
      word-break: break-all; color: var(--text-muted);
    }
    .msg-share-btn {
      background: var(--gradient-btn); color: #fff;
      border: none; border-radius: 10px; padding: 9px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.15s;
    }
    .msg-share-btn:hover { opacity: 0.85; }

    /* Footer */
    footer {
      background: rgba(8,12,20,0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 14px 24px 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      flex-shrink: 0;
    }

    .status-indicator {
      font-size: 0.78rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .status-indicator .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-indicator.recording { color: #f87171; }
    .status-indicator.recording .dot { background: #ef4444; box-shadow: 0 0 6px #ef4444; animation: pulse-dot 0.8s infinite; }
    .status-indicator.listening { color: #34d399; }
    .status-indicator.listening .dot { background: #34d399; box-shadow: 0 0 6px #34d399; animation: pulse-dot 2s infinite; }
    .status-indicator.paused { color: #fbbf24; }

    .footer-controls {
      display: flex; align-items: center; gap: 16px;
    }

    #btn-mic {
      width: 68px; height: 68px;
      border-radius: 50%; border: none;
      background: var(--gradient-btn);
      font-size: 1.6rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 0 0 0 rgba(99,102,241,0), 0 6px 20px rgba(99,102,241,0.4);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #btn-mic::before {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(99,102,241,0.25);
      animation: ring-pulse 2.5s ease-in-out infinite;
    }
    @keyframes ring-pulse {
      0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:0.1;transform:scale(1.08)}
    }
    #btn-mic:active, #btn-mic.recording {
      background: linear-gradient(135deg,#ef4444,#f97316) !important;
      box-shadow: 0 6px 24px rgba(239,68,68,0.45) !important;
      transform: scale(0.95);
    }

    .btn-sm {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      position: relative;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-sm.active {
      background: rgba(45,212,191,0.1);
      border-color: rgba(45,212,191,0.4);
      color: #2dd4bf;
      box-shadow: 0 0 0 3px rgba(45,212,191,0.08);
    }
    .btn-sm.active.pause {
      background: rgba(251,191,36,0.1);
      border-color: rgba(251,191,36,0.4);
      color: #fbbf24;
    }
    .btn-sm.muted { opacity: 0.35; }

    .footer-hint {
      font-size: 0.68rem;
      color: var(--text-dim);
      display: flex; align-items: center; gap: 4px;
    }
    .footer-hint .sep { opacity: 0.3; }

    #btn-share {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }
    #btn-share:hover { color: var(--text); border-color: rgba(56,189,248,0.3); }
  </style>
</head>
<body>
  <div class="aurora-bg"><div class="aurora-spot"></div></div>

  <!-- LOGIN SCREEN -->
  <div id="screen-select">
    <div class="select-card">
      <div class="logo-wrap">
        <div class="logo-icon">🌉</div>
      </div>
      <div class="app-title">WhisperBridge</div>
      <div class="app-subtitle" id="room-label">Traduction vocale en temps réel</div>

      <div class="form-group">
        <div class="label">Prénom</div>
        <input id="input-name" type="text" placeholder="Ton prénom" maxlength="20" autocomplete="off"
          onkeydown="if(event.key==='Enter') connectUser()" />
      </div>

      <div class="form-group">
        <div class="label">Langue</div>
        <select id="select-lang">
          <option value="fr">🇫🇷 Français</option>
          <option value="en">🇬🇧 English</option>
          <option value="zh">🇨🇳 中文 (Mandarin)</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="es">🇪🇸 Español</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="pt">🇵🇹 Português</option>
        </select>
      </div>

      <button class="btn-join" onclick="connectUser()" id="btn-join">Créer une conversation →</button>

      <div class="badge">✦ Propulsé par Whisper AI + LibreTranslate</div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="screen-chat" class="hidden">
    <header>
      <div class="header-left">
        <div class="header-logo">🌉</div>
        <div>
          <div class="header-title">WhisperBridge</div>
        </div>
        <div class="header-room" id="header-room-id"></div>
      </div>
      <div class="header-right">
        <div id="header-users"></div>
        <button class="btn-icon" onclick="shareRoom()" title="Partager">🔗</button>
        <button class="btn-icon" onclick="showLogin()" title="Quitter">✕</button>
      </div>
    </header>

    <div id="messages"></div>

    <footer>
      <div class="hidden status-indicator recording" id="recording-indicator">
        <div class="dot"></div> Enregistrement…
      </div>
      <div class="hidden status-indicator listening" id="vad-listening">
        <div class="dot"></div> En écoute…
      </div>
      <div class="hidden status-indicator paused" id="pause-indicator">⏸ Traduction en pause</div>

      <div class="footer-controls">
        <button class="btn-sm" id="btn-vad" onclick="toggleVAD()" title="Mode auto">🤖</button>
        <button id="btn-mic" onmousedown="startRecording()" onmouseup="stopRecording()"
          ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
        <button class="btn-sm active" id="btn-tts" onclick="toggleTTS()" title="Lecture vocale">🔊</button>
        <button class="btn-sm" id="btn-pause" onclick="togglePause()" title="Pause">⏸️</button>
      </div>

      <div style="display:flex;align-items:center;gap:16px;">
        <div class="footer-hint">🤖 Auto <span class="sep">·</span> 🎤 Maintenir <span class="sep">·</span> 🔊 TTS <span class="sep">·</span> ⏸ Pause</div>
      </div>
      <div><button id="btn-share" onclick="shareRoom()">🔗 Partager le lien</button></div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
  <script>
    function showLogin() {
      document.getElementById('screen-select').classList.remove('hidden');
      document.getElementById('screen-chat').classList.add('hidden');
    }
    // Preview helpers — make header room visible
    const origConnect = connectUser;
    const origInitRoom = initRoomUI;
    function updateRoomBadge() {
      const rid = document.getElementById('header-room-id');
      if (rid && window.roomId) rid.textContent = window.roomId;
    }
  </script>
</body>
</html>
